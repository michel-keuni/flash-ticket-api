name: CI/CD Pipeline - Flash Ticket API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------
  # JOB 1 : Exécution des tests automatisés (CI)
  # ----------------------------------------------------
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/flashticket_test
      SECRET_KEY: test_secret_key_ci
      IS_DEV: True
      PROJECT_NAME: FlashTicket
      VERSION: 1.0.0
      ACCESS_TOKEN_EXPIRE_MINUTES: 30


    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: flashticket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run Tests with Coverage
        run: |
          pytest --cov=app

  # ----------------------------------------------------
  # JOB 2 : Déploiement automatique sur EC2 (CD)
  # ----------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    needs: test  # Ne se déclenche QUE si les tests réussissent
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            cd /opt/flash_ticket/flash-ticket-api

            echo "[CI/CD] Vérification de Docker Compose..."
            docker compose version

            echo "[CI/CD] Récupération du dernier code Git..."
            git pull --ff-only origin main

            echo "[CI/CD] Reconstruction et relance de la stack..."
            docker compose up -d --build --remove-orphans

            echo "[CI/CD] Vérification des conteneurs..."
            docker compose ps

            echo "[CI/CD] État de santé des conteneurs..."
            docker ps

            echo "[CI/CD] Nettoyage des anciennes images inutilisées..."
            docker image prune -f

            echo "[CI/CD] Déploiement terminé."