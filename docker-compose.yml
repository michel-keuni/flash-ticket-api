version: '3.8'

services:
  # --- Service Base de Données ---
  db:
    image: postgres:16-alpine
    container_name: flash_ticket_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flashticket}
    volumes:
      # Persistance des données PostgreSQL sur le disque hôte
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flashticket}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Service API FastAPI ---
  api:
    build: .
    container_name: flash_ticket_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-flashticket}
      - SECRET_KEY=${SECRET_KEY}
      - PROJECT_NAME=${PROJECT_NAME:-Flash Ticket API}
      - VERSION=${VERSION:-1.0.0}
      - IS_DEV=${IS_DEV:-False}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
